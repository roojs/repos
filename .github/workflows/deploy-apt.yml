name: Publish APT Repo via Reprepro

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-repo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y reprepro gpg

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.APT_GPG_PASSPHRASE }}

      - name: Download .deb artifacts
        uses: dsaltares/fetch-gh-release-asset@master
        with:
          version: latest
          file: '.*\.deb$'
          regex: true
          target: incoming/
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Ingest packages with reprepro
        env:
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail

          GPG_KEY_ID="$(gpg --list-secret-keys --keyid-format LONG | grep '^sec' | head -n 1 | awk '{print $2}' | cut -d'/' -f2)"
          if [ -z "${GPG_KEY_ID}" ]; then
            echo "No GPG signing key found after import." >&2
            exit 1
          fi

          sed -i "s/SignWith: APT_GPG_KEY_ID/SignWith: ${GPG_KEY_ID}/g" conf/distributions
          sed -i "s/SignWith: default/SignWith: ${GPG_KEY_ID}/g" conf/distributions

          gpg --armor --export "${GPG_KEY_ID}" > KEY.gpg

          shopt -s nullglob
          debs=(incoming/*.deb)
          if [ "${#debs[@]}" -eq 0 ]; then
            echo "No .deb packages found in the release." >&2
            exit 1
          fi

          CODENAMES="trixie questing resolute"
          for deb in "${debs[@]}"; do
            for distro in ${CODENAMES}; do
              reprepro -b . includedeb "${distro}" "${deb}"
            done
          done

          rm -rf incoming/

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update APT repository via reprepro"
          branch: gh-pages
