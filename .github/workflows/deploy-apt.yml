name: Publish APT Repo via Reprepro

# Manual publish for now. Daily polling of upstream releases is planned but not
# enabled yet — see the commented schedule block below.
on:
  workflow_dispatch:
    inputs:
      repos:
        description: Optional comma-separated upstream repos (empty = all in config/upstream-repos.json)
        required: false
        default: ''

# Planned (not enabled):
# on:
#   schedule:
#     - cron: '0 6 * * *'

permissions:
  contents: write

jobs:
  update-repo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          path: main

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
          path: apt-repo

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y reprepro gpg jq

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.APT_GPG_PASSPHRASE }}

      - name: Download upstream .deb release assets
        working-directory: main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x scripts/fetch-upstream-debs.sh
          ./scripts/fetch-upstream-debs.sh \
            "${GITHUB_WORKSPACE}/apt-repo/incoming" \
            config/upstream-repos.json \
            "${{ inputs.repos }}"

      - name: Ingest packages with reprepro
        working-directory: apt-repo
        env:
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail

          GPG_KEY_ID="$(gpg --list-secret-keys --keyid-format LONG | grep '^sec' | head -n 1 | awk '{print $2}' | cut -d'/' -f2)"
          if [ -z "${GPG_KEY_ID}" ]; then
            echo "No GPG signing key found after import." >&2
            exit 1
          fi

          sed -i "s/SignWith: APT_GPG_KEY_ID/SignWith: ${GPG_KEY_ID}/g" conf/distributions
          sed -i "s/SignWith: default/SignWith: ${GPG_KEY_ID}/g" conf/distributions

          gpg --armor --export "${GPG_KEY_ID}" > KEY.gpg

          shopt -s nullglob
          debs=(incoming/*.deb)
          if [ "${#debs[@]}" -eq 0 ]; then
            echo "No .deb packages found to ingest." >&2
            exit 1
          fi

          CODENAMES="trixie questing resolute"
          for deb in "${debs[@]}"; do
            for distro in ${CODENAMES}; do
              reprepro -b . includedeb "${distro}" "${deb}"
            done
          done

          rm -rf incoming/

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update APT repository via reprepro"
          branch: gh-pages
          repository: apt-repo
