name: Publish package repositories

# Polls upstream releases daily. Downloads assets only when release tags,
# GitHub asset file names/digests, or Debian pool versions change. Publishes
# when the package manifest changes (including repo config).
on:
  schedule:
    - cron: '0 6 * * *'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      repos:
        description: Optional comma-separated upstream repos (empty = all in config/repos.json)
        required: false
        default: ''
      force:
        description: Publish even if upstream packages are unchanged
        type: boolean
        default: false
  repository_dispatch:
    types: [publish-repos]

permissions:
  contents: write

concurrency:
  group: publish-repos
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          path: main

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
          path: pages

      - name: Install fetch prerequisites
        run: sudo apt-get update && sudo apt-get install -y zstd

      - name: Download upstream .deb release assets
        id: fetch-debs
        working-directory: main
        env:
          GH_TOKEN: ${{ github.token }}
          FETCH_FORCE: ${{ inputs.force }}
        run: |
          set +e
          chmod +x scripts/fetch-upstream.sh
          ./scripts/fetch-upstream.sh \
            config/repos.json \
            "${GITHUB_WORKSPACE}/pages/incoming-debs" \
            deb \
            "${{ inputs.repos }}" \
            "${GITHUB_WORKSPACE}/pages/.publish-manifest.json"
          status=$?
          set -e
          if [[ "${status}" -eq 0 ]]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download upstream .rpm release assets
        id: fetch-rpms
        working-directory: main
        env:
          GH_TOKEN: ${{ github.token }}
          FETCH_FORCE: ${{ inputs.force }}
        run: |
          set +e
          chmod +x scripts/fetch-upstream.sh
          ./scripts/fetch-upstream.sh \
            config/repos.json \
            "${GITHUB_WORKSPACE}/pages/incoming-rpms" \
            rpm \
            "${{ inputs.repos }}" \
            "${GITHUB_WORKSPACE}/pages/.publish-manifest.json"
          status=$?
          set -e
          if [[ "${status}" -eq 0 ]]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Require at least one package type
        run: |
          if [[ "${{ steps.fetch-debs.outputs.found }}" != "true" && "${{ steps.fetch-rpms.outputs.found }}" != "true" ]]; then
            echo "No .deb or .rpm packages were downloaded." >&2
            exit 1
          fi

      - name: Check for package changes
        id: changes
        run: |
          chmod +x main/scripts/generate-distributions.sh main/scripts/package-manifest.sh
          main/scripts/generate-distributions.sh main/config/repos.json > /tmp/distributions
          main/scripts/package-manifest.sh \
            pages \
            main/config/repos.json \
            /tmp/distributions \
            /tmp/current-manifest.json

      - name: Install reprepro dependencies
        if: steps.fetch-debs.outputs.found == 'true' || steps.fetch-rpms.outputs.found == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y reprepro createrepo-c gpg jq

      - name: Import GPG key for reprepro
        if: steps.fetch-debs.outputs.found == 'true' || steps.fetch-rpms.outputs.found == 'true'
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.APT_GPG_PASSPHRASE }}

      - name: Prune packages no longer in manifest
        id: prune
        if: steps.fetch-debs.outputs.found == 'true'
        working-directory: main
        run: |
          chmod +x scripts/reprepro-prune.sh
          ./scripts/reprepro-prune.sh \
            "${GITHUB_WORKSPACE}/pages" \
            config/repos.json \
            /tmp/current-manifest.json

      - name: Prune RPM packages no longer in manifest
        id: rpm-prune
        if: steps.fetch-rpms.outputs.found == 'true'
        working-directory: main
        run: |
          chmod +x scripts/rpm-prune.sh
          ./scripts/rpm-prune.sh \
            "${GITHUB_WORKSPACE}/pages" \
            /tmp/current-manifest.json

      - name: Check for manifest packages missing from repo
        id: missing
        if: steps.fetch-debs.outputs.found == 'true'
        working-directory: main
        run: |
          chmod +x scripts/reprepro-missing.sh
          ./scripts/reprepro-missing.sh \
            "${GITHUB_WORKSPACE}/pages" \
            config/repos.json \
            /tmp/current-manifest.json

      - name: Skip publish when unchanged
        if: steps.changes.outputs.changed != 'true' && inputs.force != true && steps.prune.outputs.pruned != 'true' && steps.rpm-prune.outputs.pruned != 'true' && steps.missing.outputs.missing != 'true'
        run: |
          echo "No changes to publish."
          rm -rf pages/incoming-debs pages/incoming-rpms

      - name: Export repository signing key
        if: steps.changes.outputs.changed == 'true' || inputs.force == true || steps.prune.outputs.pruned == 'true' || steps.rpm-prune.outputs.pruned == 'true' || steps.missing.outputs.missing == 'true'
        working-directory: pages
        run: |
          set -euo pipefail
          GPG_KEY_ID="$(gpg --list-secret-keys --keyid-format LONG | grep '^sec' | head -n 1 | awk '{print $2}' | cut -d'/' -f2)"
          if [ -z "${GPG_KEY_ID}" ]; then
            echo "No GPG signing key found after import." >&2
            exit 1
          fi
          echo "GPG_KEY_ID=${GPG_KEY_ID}" >> "$GITHUB_ENV"
          gpg --armor --export "${GPG_KEY_ID}" > key.gpg

      - name: Sync reprepro config
        if: steps.changes.outputs.changed == 'true' || inputs.force == true || steps.prune.outputs.pruned == 'true' || steps.rpm-prune.outputs.pruned == 'true' || steps.missing.outputs.missing == 'true'
        run: main/scripts/generate-distributions.sh main/config/repos.json > pages/conf/distributions

      - name: Ingest packages with reprepro
        if: (steps.changes.outputs.changed == 'true' || inputs.force == true || steps.missing.outputs.missing == 'true') && steps.fetch-debs.outputs.found == 'true'
        working-directory: main
        env:
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          chmod +x scripts/reprepro-ingest.sh
          ./scripts/reprepro-ingest.sh \
            "${GITHUB_WORKSPACE}/pages" \
            "${GPG_KEY_ID}" \
            config/repos.json

      - name: Build DNF repositories
        if: (steps.changes.outputs.changed == 'true' || inputs.force == true || steps.prune.outputs.pruned == 'true' || steps.rpm-prune.outputs.pruned == 'true' || steps.missing.outputs.missing == 'true') && (steps.fetch-rpms.outputs.found == 'true' || steps.rpm-prune.outputs.pruned == 'true')
        working-directory: main
        env:
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          chmod +x scripts/build-rpm-repos.sh
          ./scripts/build-rpm-repos.sh \
            "${GITHUB_WORKSPACE}/pages/incoming-rpms" \
            "${GITHUB_WORKSPACE}/pages"

      - name: Update publish manifest
        if: steps.changes.outputs.changed == 'true' || inputs.force == true || steps.prune.outputs.pruned == 'true' || steps.rpm-prune.outputs.pruned == 'true' || steps.missing.outputs.missing == 'true'
        run: cp /tmp/current-manifest.json pages/.publish-manifest.json

      - name: Clean up incoming packages
        if: steps.changes.outputs.changed == 'true' || inputs.force == true || steps.prune.outputs.pruned == 'true' || steps.rpm-prune.outputs.pruned == 'true' || steps.missing.outputs.missing == 'true'
        run: rm -rf pages/incoming-debs pages/incoming-rpms

      - name: Sync client setup files to Pages
        run: |
          test -f main/docs/sources
          test -f main/docs/repo
          cp -f main/docs/sources main/docs/repo pages/
          chmod +x main/scripts/generate-index-html.sh
          main/scripts/generate-index-html.sh "${GITHUB_WORKSPACE}/pages"

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update package repositories"
          branch: gh-pages
          repository: pages
