name: Publish package repositories

# Polls upstream releases daily. Publishes only when packages or repo config change.
on:
  schedule:
    - cron: '0 6 * * *'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      repos:
        description: Optional comma-separated upstream repos (empty = all in config/upstream-repos.json)
        required: false
        default: ''
      force:
        description: Publish even if upstream packages are unchanged
        type: boolean
        default: false
  repository_dispatch:
    types: [publish-repos]

permissions:
  contents: write

concurrency:
  group: publish-repos
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          path: main

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
          path: pages

      - name: Download upstream .deb release assets
        id: fetch-debs
        working-directory: main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x scripts/fetch-upstream-debs.sh
          set +e
          ./scripts/fetch-upstream-debs.sh \
            "${GITHUB_WORKSPACE}/pages/incoming-debs" \
            config/upstream-repos.json \
            "${{ inputs.repos }}"
          status=$?
          set -e
          if [[ "${status}" -eq 0 ]]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download upstream .rpm release assets
        id: fetch-rpms
        working-directory: main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x scripts/fetch-upstream-rpms.sh
          set +e
          ./scripts/fetch-upstream-rpms.sh \
            "${GITHUB_WORKSPACE}/pages/incoming-rpms" \
            config/upstream-repos.json \
            "${{ inputs.repos }}"
          set -e
          if compgen -G "${GITHUB_WORKSPACE}/pages/incoming-rpms/*.rpm" > /dev/null; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Require at least one package type
        run: |
          if [[ "${{ steps.fetch-debs.outputs.found }}" != "true" && "${{ steps.fetch-rpms.outputs.found }}" != "true" ]]; then
            echo "No .deb or .rpm packages were downloaded." >&2
            exit 1
          fi

      - name: Check for package changes
        id: changes
        run: |
          python3 main/scripts/package-manifest.py \
            --pages pages \
            --debs pages/incoming-debs \
            --rpms pages/incoming-rpms \
            --distributions main/config/distributions \
            --output /tmp/current-manifest.json

      - name: Skip publish when unchanged
        if: steps.changes.outputs.changed != 'true' && inputs.force != true
        run: |
          echo "No changes to publish."
          rm -rf pages/incoming-debs pages/incoming-rpms

      - name: Install dependencies
        if: steps.changes.outputs.changed == 'true' || inputs.force == true
        run: |
          sudo apt-get update
          sudo apt-get install -y reprepro createrepo-c gpg jq

      - name: Import GPG key
        if: steps.changes.outputs.changed == 'true' || inputs.force == true
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.APT_GPG_PASSPHRASE }}

      - name: Sync reprepro config
        if: steps.changes.outputs.changed == 'true' || inputs.force == true
        run: cp main/config/distributions pages/conf/distributions

      - name: Export repository signing key
        if: steps.changes.outputs.changed == 'true' || inputs.force == true
        working-directory: pages
        run: |
          set -euo pipefail
          GPG_KEY_ID="$(gpg --list-secret-keys --keyid-format LONG | grep '^sec' | head -n 1 | awk '{print $2}' | cut -d'/' -f2)"
          if [ -z "${GPG_KEY_ID}" ]; then
            echo "No GPG signing key found after import." >&2
            exit 1
          fi
          echo "GPG_KEY_ID=${GPG_KEY_ID}" >> "$GITHUB_ENV"
          gpg --armor --export "${GPG_KEY_ID}" > KEY.gpg

      - name: Ingest packages with reprepro
        if: (steps.changes.outputs.changed == 'true' || inputs.force == true) && steps.fetch-debs.outputs.found == 'true'
        working-directory: pages
        env:
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          sed -i "s/SignWith: default/SignWith: ${GPG_KEY_ID}/g" conf/distributions

          shopt -s nullglob
          debs=(incoming-debs/*.deb)
          CODENAMES="trixie questing resolute"
          for deb in "${debs[@]}"; do
            for distro in ${CODENAMES}; do
              reprepro -b . includedeb "${distro}" "${deb}"
            done
          done

      - name: Build DNF repositories
        if: (steps.changes.outputs.changed == 'true' || inputs.force == true) && steps.fetch-rpms.outputs.found == 'true'
        working-directory: main
        env:
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          chmod +x scripts/build-rpm-repos.sh
          ./scripts/build-rpm-repos.sh \
            "${GITHUB_WORKSPACE}/pages/incoming-rpms" \
            "${GITHUB_WORKSPACE}/pages"

      - name: Update publish manifest
        if: steps.changes.outputs.changed == 'true' || inputs.force == true
        run: cp /tmp/current-manifest.json pages/.publish-manifest.json

      - name: Clean up incoming packages
        if: steps.changes.outputs.changed == 'true' || inputs.force == true
        run: rm -rf pages/incoming-debs pages/incoming-rpms

      - name: Commit and push changes
        if: steps.changes.outputs.changed == 'true' || inputs.force == true
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update APT and DNF repositories"
          branch: gh-pages
          repository: pages
