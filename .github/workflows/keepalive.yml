name: Repository keepalive

# GitHub disables scheduled workflows after 60 days without repository activity.
# This job commits twice a month so schedules stay enabled even if publishing fails.
on:
  schedule:
    - cron: '0 12 1,15 * *'

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v7

      - name: Record keepalive timestamp
        run: date -u +%Y-%m-%dT%H:%M:%SZ > .github/keepalive

      - name: Commit keepalive
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: repository keepalive"
